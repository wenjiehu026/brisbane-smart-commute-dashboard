services:
  - type: web
    name: brisbane-smart-commute-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENABLE_LIVE_INGESTION
        value: "false"
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app
