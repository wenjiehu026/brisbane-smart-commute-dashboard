services:
  - type: web
    name: brisbane-smart-commute-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: BRISCOMMUTE_DB_PATH
        value: /tmp/commute.db
      - key: ENABLE_LIVE_INGESTION
        value: "true"
      - key: TRANSLINK_VEHICLE_POSITIONS_URL
        value: https://gtfsrt.api.translink.com.au/api/realtime/SEQ/VehiclePositions
      - key: TRANSLINK_TRIP_UPDATES_URL
        value: https://gtfsrt.api.translink.com.au/api/realtime/SEQ/TripUpdates
      - key: TRANSLINK_SERVICE_ALERTS_URL
        value: https://gtfsrt.api.translink.com.au/api/realtime/SEQ/Alerts
      - key: CORS_ORIGINS
        value: https://brisbane-smart-commute-dashboard.vercel.app
